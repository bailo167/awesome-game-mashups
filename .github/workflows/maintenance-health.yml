name: Maintenance health

on:
  workflow_dispatch:
  schedule:
    # 07:15 and 19:15 Australia/Brisbane, independent of the ChatGPT task.
    - cron: '15 9,21 * * *'
  push:
    branches: [main]
    paths:
      - '.github/catalogue-state.json'
      - '.github/workflows/maintenance-health.yml'
      - 'scripts/maintenance_health.py'
      - 'tests/test_maintenance_health.py'

permissions:
  contents: read

concurrency:
  group: maintenance-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freshness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the read-only health check
        run: python3 -m unittest discover -s tests -p 'test_maintenance_health.py' -v
      - name: Assess full research checkpoint freshness
        run: |
          mkdir -p build
          result=0
          python3 scripts/maintenance_health.py > build/maintenance-health.json || result=$?
          {
            echo '## Full research-cycle freshness'
            echo 'A failing freshness check is not a generator failure. Do not advance audit dates just to clear it.'
            echo '```json'
            cat build/maintenance-health.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Retain diagnostic report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintenance-health
          path: build/maintenance-health.json
          retention-days: 14
          if-no-files-found: warn
