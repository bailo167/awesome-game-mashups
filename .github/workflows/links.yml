name: Check links

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main]
    paths: ['data/**', 'scripts/check_links.py', '.github/workflows/links.yml']

permissions:
  contents: read

concurrency:
  group: link-audit
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit public source reachability without credentials
        run: |
          python3 scripts/migrate_catalogue.py
          python3 scripts/check_links.py
      - name: Preserve every URL result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: link-reachability
          path: build/link-report.json
          retention-days: 14
          if-no-files-found: error
